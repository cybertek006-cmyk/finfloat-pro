name: finfloat
description: FinFloat Pro - Offline Fintech Float Management System by Digitronic Services.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local database (offline)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Local settings + secure PIN storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6

  # UI
  intl: ^0.19.0

  # Backup: zip + share sheet (Google Drive ke liye)
  archive: ^3.6.1
  share_plus: ^10.1.2
  file_picker: ^8.1.6

  # Reports
  pdf: ^3.11.1
  printing: ^5.13.4

  # Attachments
  image_picker: ^1.1.2
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
